<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<title>Co dál? – Vault</title>
<script>try{var s=JSON.parse(localStorage.getItem("vault.skin"));document.documentElement.dataset.theme=["samurai","dark","light"].indexOf(s)<0?"samurai":s}catch(e){document.documentElement.dataset.theme="samurai"}</script>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/skin-samurai.css">
<style>
  html, body { height: auto; min-height: 100%; overflow: auto; }
  body { padding: 0 0 calc(32px + env(safe-area-inset-bottom)); }
  .dl-top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top));
    background: var(--bg2); border-bottom: 1px solid var(--border); }
  .dl-top a { color: var(--link); text-decoration: none; font-weight: 600; white-space: nowrap; }
  .dl-top h1 { font-family: var(--font-display, var(--font-ui)); font-size: 18px; margin: 0; flex: 1; min-width: 0; }
  .dl-top select { background: var(--bg2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font: inherit; min-height: 36px; cursor: pointer; }
  .dl-wrap { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 16px; }
  .dl-intro { color: var(--muted); line-height: 1.5; font-size: 14px; margin: 0 0 14px; }
  .dl-search { width: 100%; background: var(--bg1); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font: inherit; min-height: 44px; margin-bottom: 14px; }
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .crumbs button { background: none; border: none; color: var(--link); cursor: pointer; font: inherit; padding: 4px 0; min-height: 32px; }
  .step-h { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .tile { text-align: left; background: var(--bg2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer; font: inherit; min-height: 64px; }
  .tile:hover { background: var(--bg3); border-color: var(--accent); }
  .tile b { display: block; font-family: var(--font-display, var(--font-ui)); font-size: 17px; letter-spacing: .03em; }
  .tile span { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .tile i { float: right; font-style: normal; color: var(--accent); font-size: 12px; }
  .sits { display: flex; flex-direction: column; gap: 8px; }
  .sit { text-align: left; background: var(--bg2); color: var(--text); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 8px; padding: 12px 14px; cursor: pointer; font: inherit; min-height: 48px; }
  .sit:hover { background: var(--bg3); }
  .sit small { color: var(--muted); display: block; margin-top: 2px; font-size: 12px; }
  .answer { background: linear-gradient(180deg, var(--bg2), var(--bg1)); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; box-shadow: 0 2px 12px rgba(0,0,0,.25); }
  .answer h2 { font-family: var(--font-display, var(--font-ui)); font-size: 26px; line-height: 1.1; margin: 0 0 12px; }
  .answer ol { margin: 0; padding: 0; list-style: none; counter-reset: s; }
  .answer li { counter-increment: s; position: relative; padding: 10px 12px 10px 46px; background: var(--bg1); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; line-height: 1.5; }
  .answer li::before { content: counter(s); position: absolute; left: 12px; top: 9px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
  .why { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .pill { border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; background: var(--bg1); }
  .pill.conf { border-style: dashed; }
  .open { display: inline-block; margin-top: 12px; color: var(--link); text-decoration: none; font-weight: 600; }
  .open:hover { color: var(--link-hover); }
  .then { margin-top: 20px; }
  .none { color: var(--muted); padding: 24px 0; text-align: center; }
  .foot { margin-top: 28px; color: var(--muted); font-size: 12px; line-height: 1.6; border-top: 1px solid var(--border); padding-top: 12px; }
  @media (max-width: 600px) { .dl-wrap { padding: 12px 14px; } .answer h2 { font-size: 22px; } .tiles { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<script src="/topbar.js"></script>
<div class="dl-wrap">
  <p class="dl-intro" id="intro">Načítám…</p>
  <input class="dl-search" id="q" type="search" placeholder="Hledat situaci: maskuje, generic, drop 2, Live padá…" aria-label="Hledat situaci">
  <div class="crumbs" id="crumbs"></div>
  <div id="view"></div>
  <div class="foot" id="foot"></div>
</div>
<script src="/dal.js"></script>
</body>
</html>

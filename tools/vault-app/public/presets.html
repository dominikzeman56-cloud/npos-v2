<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<title>Presety – Vault</title>
<script>try{var s=JSON.parse(localStorage.getItem("vault.skin"));document.documentElement.dataset.theme=["samurai","dark","light"].indexOf(s)<0?"samurai":s}catch(e){document.documentElement.dataset.theme="samurai"}</script>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/skin-samurai.css">
<style>
  html, body { height: auto; min-height: 100%; overflow: auto; }
  body { padding: 0 0 calc(20px + env(safe-area-inset-bottom)); }
  .pz-top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; padding: 8px 18px; padding-top: calc(8px + env(safe-area-inset-top));
    background: var(--bg2); border-bottom: 1px solid var(--border); height: 52px; box-sizing: border-box; }
  .pz-top a.back { color: var(--link); text-decoration: none; font-weight: 600; white-space: nowrap; }
  .pz-top h1 { font-family: var(--font-display, var(--font-ui)); font-size: 20px; margin: 0; flex: 1; min-width: 0; letter-spacing: .03em; }
  .pz-top select { background: var(--bg2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px; font: inherit; min-height: 34px; cursor: pointer; }
  .pz-wrap { position: relative; z-index: 1; max-width: 1800px; margin: 0 auto; padding: 12px 18px 0; }
  .pz-intro { color: var(--muted); margin: 0 0 10px; line-height: 1.45; font-size: 13px; max-width: 1100px; }
  .pz-intro b { color: var(--text); }

  /* master – detail: list left (fixed), panel right (fills the screen) */
  .pz-main { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 18px; align-items: start; }
  .pz-side { position: sticky; top: 64px; height: calc(100dvh - 76px); display: flex; flex-direction: column; min-width: 0; }
  .pz-find { flex: none; display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; }
  .pz-find input[type=search] { width: 100%; background: var(--bg1); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font: inherit; min-height: 40px; box-sizing: border-box; }
  .pz-find .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 2px 0 -3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { border: 1px solid var(--border); background: var(--bg1); color: var(--text); border-radius: 999px; padding: 3px 9px; font: inherit; font-size: 12px; cursor: pointer; min-height: 28px; }
  .chip.on { background: var(--accent-bg); border-color: var(--accent); }
  .chip .n { color: var(--muted); margin-left: 4px; font-size: 11px; }
  .pz-filters { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
  .pz-filters > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 8px; min-height: 28px; align-items: center; font-size: 13px; color: var(--muted); }
  .pz-filters > summary::-webkit-details-marker { display: none; }
  .pz-filters > summary::after { content: "▾"; color: var(--faint); }
  .pz-filters[open] > summary::after { content: "▴"; }
  .pz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; margin: 8px 0 4px; }
  .pz-f .t { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 3px; }
  .pz-f select { width: 100%; background: var(--bg1); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 6px; font: inherit; font-size: 13px; min-height: 34px; box-sizing: border-box; }
  .pz-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; }
  .pz-bar .reset { background: none; border: none; color: var(--link); cursor: pointer; font: inherit; padding: 2px 0; }
  .pz-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; padding-right: 4px; }
  .row { display: block; width: 100%; text-align: left; background: var(--bg2); color: var(--text); border: 1px solid var(--border); border-left: 3px solid transparent;
    border-radius: 6px; padding: 7px 10px; font: inherit; cursor: pointer; min-width: 0; flex: none; }
  .row:hover { background: var(--bg3); }
  .row[aria-current="true"] { border-left-color: var(--accent); background: var(--accent-bg); }
  .row .nm { font-weight: 600; overflow-wrap: anywhere; display: block; font-size: 14px; }
  .row .mt { display: flex; flex-wrap: wrap; gap: 3px 6px; margin-top: 3px; align-items: center; font-size: 11px; color: var(--muted); }
  .pempty { color: var(--muted); padding: 24px 0; text-align: center; }

  .tag { font-size: 11px; border-radius: 4px; padding: 1px 6px; background: var(--bg3); color: var(--text); text-decoration: none; white-space: nowrap; }
  a.tag.arch { background: var(--accent-bg); color: var(--link); }
  a.tag.arch:hover { color: var(--link-hover); }
  .tag.hyp { background: none; border: 1px dashed var(--faint); color: var(--muted); }
  .dim { color: var(--muted); }

  /* detail */
  .pz-detail { min-width: 0; }
  .dh { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 4px 28px; align-items: start; }
  .dh h2 { grid-column: 1 / -1; font-family: var(--font-display, var(--font-ui)); font-size: 30px; line-height: 1.05; margin: 0; overflow-wrap: anywhere; }
  .dh .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; align-items: center; }
  .dh .cues { font-size: 13px; line-height: 1.55; }
  .dh .why, .dh .meta { color: var(--muted); font-size: 12px; line-height: 1.5; }
  .dh .l, .dh .r { min-width: 0; }
  .back-list { display: none; background: none; border: 1px solid var(--border); color: var(--link); border-radius: 6px; padding: 8px 12px; font: inherit; cursor: pointer; margin-bottom: 12px; min-height: 40px; }

  /* synth panel: fixed grids so every module in a row has the same size */
  .panel { margin-top: 12px; background: linear-gradient(180deg, var(--bg2), var(--bg1)); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px 16px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 2px 12px rgba(0,0,0,.25); }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: var(--font-display, var(--font-ui)); letter-spacing: .12em; font-size: 13px; }
  .flow span { padding: 2px 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg1); color: var(--muted); }
  .flow em { color: var(--accent); font-style: normal; font-size: 11px; }
  .sect { margin-top: 14px; }
  .sect > h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .sect > h3::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .g-osc { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .g-aux { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .chain { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px 10px; }
  .mod { background: var(--bg1); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px 10px; min-width: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,.02); display: flex; flex-direction: column; }
  .mod.off { opacity: .5; }
  .mod > header { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
  .mod > header h4 { margin: 0; font-family: var(--font-display, var(--font-ui)); font-size: 14px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }
  .led { width: 8px; height: 8px; border-radius: 50%; background: var(--bg3); border: 1px solid var(--border); flex: none; }
  .led.on { background: var(--sam-green, #3eea9a); border-color: transparent; box-shadow: 0 0 6px var(--sam-green, #3eea9a); }
  .lcd { background: #05080a; color: #9ff7c9; border: 1px solid var(--border); border-radius: 5px; padding: 5px 8px; margin-bottom: 8px; min-height: 42px; font-family: var(--font-mono, ui-monospace, Consolas, monospace);
    font-size: 12px; line-height: 1.35; overflow-wrap: anywhere; box-shadow: inset 0 0 10px rgba(0,0,0,.7); }
  :root[data-theme="light"] .lcd { background: #1c2a24; }
  .lcd span { display: block; color: #bfffe0; }
  .lcd small { display: block; color: #66b894; font-size: 11px; margin-top: 1px; }
  .knobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 6px 4px; align-items: start; margin-top: auto; }
  .g-osc .knobs { grid-template-columns: repeat(3, 1fr); }
  .kn { text-align: center; min-width: 0; }
  .kn svg { width: 44px; height: 44px; display: block; margin: 0 auto; overflow: visible; }
  .kn .trk path { stroke: var(--bg3); stroke-width: 3.5; fill: none; stroke-linecap: round; }
  .kn .val path { stroke: var(--accent); stroke-width: 3.5; fill: none; stroke-linecap: round; }
  .kn .ptr line { stroke: var(--text); stroke-width: 2; stroke-linecap: round; }
  .kn .mid { fill: var(--faint); }
  .kn b { display: block; font-size: 10px; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin-top: -2px; }
  .kn i { display: block; font-style: normal; font-size: 12px; font-variant-numeric: tabular-nums; }
  .kn.nov .trk path { stroke-dasharray: 2 4; }
  .kn.nov { opacity: .55; }
  .kn.nov i { color: var(--faint); font-size: 10px; }
  .ro { padding: 4px 6px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg2); align-self: center; }
  .ro span { display: block; font-size: 9px; letter-spacing: .08em; color: var(--muted); }
  .ro b { font-size: 13px; font-variant-numeric: tabular-nums; }
  .slot { position: relative; display: flex; }
  .slot .mod { flex: 1; }
  .slot .no { position: absolute; top: -6px; left: -4px; z-index: 2; font-size: 10px; background: var(--accent); color: #fff; border-radius: 8px; min-width: 16px; height: 16px; display: grid; place-items: center; }
  .matrix { border: 1px solid var(--border); border-radius: 8px; background: var(--bg1); overflow: hidden; }
  .mrow { display: grid; grid-template-columns: minmax(80px, .7fr) 18px minmax(0, 1.5fr) minmax(140px, 1fr); gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .mrow:last-child { border-bottom: 0; }
  .mrow .src { font-weight: 600; color: var(--link); overflow-wrap: anywhere; }
  .mrow .arr { color: var(--faint); text-align: center; }
  .mrow .dst { overflow-wrap: anywhere; } .mrow .dst em { font-style: normal; color: var(--muted); }
  .amt { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .amt u { text-decoration: none; font-variant-numeric: tabular-nums; min-width: 38px; text-align: right; }
  i.bip { position: relative; flex: 1; height: 6px; background: var(--bg3); border-radius: 3px; }
  i.bip::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--faint); }
  i.bip b { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 3px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pill { font-size: 12px; padding: 3px 9px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg1); color: var(--muted); }
  .macros { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px 8px; }
  .macros .kn { width: 56px; }
  .voice { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; font-size: 12px; letter-spacing: .08em; margin-top: auto; padding-top: 8px; }
  .voice b { color: var(--muted); font-weight: 600; } .voice i { font-style: normal; }
  .g-lfo { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .lfog { width: 100%; height: auto; display: block; background: #05080a; border: 1px solid var(--border); border-radius: 5px; margin-bottom: 8px; }
  .lfog .grid { stroke: rgba(159,247,201,.12); stroke-width: 1; }
  .lfog .cv { fill: none; stroke: #6fe3ff; stroke-width: 2; stroke-linejoin: round; }
  .lfog .fl { fill: rgba(111,227,255,.12); stroke: none; }
  .lfog .pt { fill: #bfffe0; }
  .lfog .xh { stroke: rgba(191,255,224,.55); stroke-width: 1; }
  .lfog .hd { fill: #bfffe0; stroke: #05080a; stroke-width: 1.5; }
  .lfog .rd { fill: #bfffe0; font-size: 7.5px; }
  .lfog .lp { stroke: #ffb347; stroke-width: 1; stroke-dasharray: 3 3; }
  .lfog text { fill: #66b894; font-size: 8px; font-family: var(--font-mono, monospace); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 2px 0 6px; }
  .chip { font-size: 11px; padding: 2px 7px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg2); color: var(--muted); white-space: nowrap; }
  .chip b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .dests { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 4px; }
  .dests b { color: var(--text); font-weight: 600; }
  .mx { display: inline-flex; flex-wrap: wrap; gap: 3px; margin-left: 4px; }
  .mx u { text-decoration: none; font-size: 10px; padding: 0 5px; border: 1px solid var(--border); border-radius: 3px; color: var(--muted); }
  details.all { margin-top: 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg1); }
  details.all > summary { cursor: pointer; padding: 10px 12px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  details.all .tb { padding: 0 12px 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px 16px; }
  details.all h5 { margin: 0 0 4px; font-size: 12px; color: var(--link); letter-spacing: .06em; }
  details.all table { width: 100%; border-collapse: collapse; font-size: 12px; }
  details.all td { padding: 1px 0; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; }
  details.all td:last-child { text-align: right; font-variant-numeric: tabular-nums; padding-left: 8px; }
  .pnote { margin-top: 16px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); padding-top: 10px; line-height: 1.5; }
  .legend { margin: 22px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; max-width: 1100px; }
  .legend a { color: var(--link); }
  .pick { color: var(--muted); padding: 60px 0; text-align: center; }

  @media (max-width: 1280px) { .g-aux { grid-template-columns: repeat(2, minmax(0, 1fr)); } .dh { grid-template-columns: 1fr; } }
  @media (max-width: 899px) {
    .pz-main { display: block; }
    .pz-side { position: static; height: auto; display: block; }
    .pz-list { overflow: visible; margin-top: 8px; padding-right: 0; }
    .pz-main:not(.show-detail) .pz-detail { display: none; }
    .pz-main.show-detail .pz-side { display: none; }
    .back-list { display: inline-block; }
    .g-osc { grid-template-columns: 1fr; }
    .g-osc .knobs { grid-template-columns: repeat(4, 1fr); }
    .g-aux { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .chain { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .mrow { grid-template-columns: 1fr 14px 1.6fr; } .mrow .amt { grid-column: 1 / -1; }
    .dh h2 { font-size: 24px; }
    .pz-wrap { padding: 10px 14px 0; }
  }
  @media (max-width: 480px) { .g-aux, .chain { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<script src="/topbar.js"></script>
<div class="pz-wrap">
  <p class="pz-intro" id="intro">Načítám…</p>
  <div class="pz-main" id="pzmain">
    <aside class="pz-side" id="side">
      <div class="pz-find">
        <input type="search" id="q" placeholder="Hledat v názvu: reese, bass, lead…" aria-label="Hledat v názvu">
        <div class="lbl">Funkce</div><div class="chips" id="fn"></div>
        <div class="lbl">Archetyp</div><div class="chips" id="arch"></div>
        <details class="pz-filters" id="filters">
          <summary><span>Další filtry</span><span id="fsum"></span></summary>
          <div class="pz-grid">
            <div class="pz-f"><label class="t" for="pack">Pack</label><select id="pack"></select></div>
            <div class="pz-f"><label class="t" for="xw">Cross-warp</label><select id="xw"></select></div>
            <div class="pz-f"><label class="t" for="uni">Unison</label><select id="uni"></select></div>
            <div class="pz-f"><label class="t" for="mono">Hlas</label><select id="mono"></select></div>
          </div>
        </details>
        <div class="pz-bar"><span id="count"></span><button class="reset" id="reset" type="button">Zrušit filtry</button></div>
      </div>
      <div class="pz-list" id="list"></div>
    </aside>
    <section class="pz-detail" id="detail" aria-live="polite"><div class="pick">Vyber preset ze seznamu.</div></section>
  </div>
  <div class="legend" id="legend"></div>
</div>
<script src="/presets.js"></script>
</body>
</html>

<html lang="cs">
<head>

<meta name="theme-color" content="#1e1e1e">
<title>Vault</title>
<script>try{var s=JSON.parse(localStorage.getItem("vault.skin"));document.documentElement.dataset.theme=["samurai","dark","light"].indexOf(s)<0?"samurai":s}catch(e){document.documentElement.dataset.theme="samurai"}</script>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/skin-samurai.css">
</head>
<body>
<script src="/topbar.js"></script>
<div id="app">
  <div id="scrim"></div>
  <nav id="ribbon"></nav>
  <aside id="left">
    <div class="side-head"></div>
    <div class="side-body"></div>
  </aside>
  <div class="resizer" id="rz-left"></div>
  <main id="main">
    <div id="tabbar"></div>
    <div id="pane"></div>
    <div id="statusbar"></div>
  </main>
  <div class="resizer" id="rz-right"></div>
  <aside id="right">
    <div class="side-head"></div>
    <div class="side-body"></div>
  </aside>
</div>
<div id="modal-root"></div>
<script src="/vendor/markdown-it.min.js"></script>

</html>
